name: Experimental latest Unity compatibility

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  editmode:
    name: Unity 6000.0.82f1 / Addressables 2.11.2
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Unity license secret configuration
        shell: pwsh
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: ./Tools/CI/Assert-UnityLicenseEnvironment.ps1

      - name: Select experimental Addressables lane
        shell: pwsh
        run: >-
          ./Tools/CI/Set-AddressablesVersion.ps1
          -ProjectPath ./AddressablesProject
          -AddressablesVersion 2.11.2

      - name: Validate repository and package invariants
        shell: pwsh
        run: |
          ./Tools/CI/Validate-PhaseZero.ps1 -ExpectedHostAddressablesVersion 2.11.2
          ./Tools/CI/Validate-PackageManifest.ps1 -PackagePath ./com.torproduction.addressables

      - name: Compile and run experimental EditMode tests
        id: unity-tests
        uses: game-ci/unity-test-runner@f7d28f891263d875d47ef34370e9e8dd6087e1ef # v5.0.0-beta.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: AddressablesProject
          unityVersion: 6000.0.82f1
          testMode: editmode
          artifactsPath: artifacts/editmode-addressables-2.11.2

      - name: Confirm package import remained inert
        if: always()
        shell: pwsh
        run: ./Tools/CI/Assert-InertProject.ps1 -ProjectPath ./AddressablesProject

      - name: Confirm Unity did not change tracked project state
        if: always()
        shell: pwsh
        run: git diff --exit-code -- AddressablesProject/Assets AddressablesProject/ProjectSettings

      - name: Upload Unity test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: experimental-unity-6000.0.82f1-addressables-2.11.2
          path: artifacts/editmode-addressables-2.11.2
          if-no-files-found: warn
