name: Unity compatibility validation

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  editmode:
    name: Addressables ${{ matrix.addressables }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addressables:
          - 2.7.6
          - 2.9.1

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Unity license secret configuration
        shell: pwsh
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: ./Tools/CI/Assert-UnityLicenseEnvironment.ps1

      - name: Select Addressables compatibility lane
        shell: pwsh
        run: >-
          ./Tools/CI/Set-AddressablesVersion.ps1
          -ProjectPath ./AddressablesProject
          -AddressablesVersion '${{ matrix.addressables }}'

      - name: Validate Phase 0 repository invariants
        shell: pwsh
        run: >-
          ./Tools/CI/Validate-PhaseZero.ps1
          -ExpectedHostAddressablesVersion '${{ matrix.addressables }}'

      - name: Validate package manifest and content
        shell: pwsh
        run: ./Tools/CI/Validate-PackageManifest.ps1 -PackagePath ./com.torproduction.addressables

      - name: Compile and run EditMode tests
        id: unity-tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: AddressablesProject
          unityVersion: 6000.0.78f1
          testMode: editmode
          artifactsPath: artifacts/editmode-${{ matrix.addressables }}

      - name: Confirm hidden sample root produced no metadata warning
        if: always()
        shell: pwsh
        run: >-
          ./Tools/CI/Assert-NoSamplesTildeMetaWarning.ps1
          -LogPath ./artifacts/editmode-${{ matrix.addressables }}/editmode.log

      - name: Confirm package import remained inert
        if: always()
        shell: pwsh
        run: ./Tools/CI/Assert-InertProject.ps1 -ProjectPath ./AddressablesProject

      - name: Confirm Unity did not change tracked project state
        if: always()
        shell: pwsh
        run: git diff --exit-code -- AddressablesProject/Assets AddressablesProject/ProjectSettings

      - name: Upload Unity test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: editmode-addressables-${{ matrix.addressables }}
          path: artifacts/editmode-${{ matrix.addressables }}
          if-no-files-found: warn
